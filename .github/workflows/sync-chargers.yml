name: Weekly Sync Japan Chargers

on:
  schedule:
    # Every Monday at 03:00 JST (Sunday 18:00 UTC)
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --no-cache-dir numpy scipy

      - name: Update Superchargers & FLASH NACS chargers
        run: |
          python scripts/update_chargers.py
          python scripts/build_third_party_nacs.py

      - name: Commit updated charger data if changed
        id: git_diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/superchargers.json public/data/nacs_chargers.json
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: weekly sync Japan Superchargers & FLASH NACS chargers"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages
        if: steps.git_diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.git_diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.git_diff.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
